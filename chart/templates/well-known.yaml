{{- if .Values.wellKnown.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-well-known
  labels:
    app.kubernetes.io/name: matrix-well-known
data:
  server: |
    {"m.server": {{ .Values.wellKnown.federationTarget | quote }}}
  client: |
    {
      "m.homeserver": {
        "base_url": {{ .Values.wellKnown.clientBaseUrl | quote }}
      },
      "org.matrix.msc2965.authentication": {
        "issuer": {{ .Values.wellKnown.masIssuer | quote }},
        "account": {{ .Values.wellKnown.masAccount | quote }}
      }
      {{- if .Values.identityServer.enabled }},
      "m.identity_server": {
        "base_url": "https://{{ .Values.identityServer.ingress.host }}"
      }
      {{- end }}
    }
  nginx.conf: |
    # Client discovery libraries (confirmed with Element X) send an
    # OPTIONS preflight before the GET, same as a browser would - plain
    # nginx static serving 405s on OPTIONS by default, which some clients
    # treat as a hard discovery failure instead of just skipping CORS.
    # Mirrors the headers Synapse's own endpoints return for OPTIONS.
    server {
      listen 80;
      location = /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        if ($request_method = OPTIONS) {
          add_header Access-Control-Allow-Origin * always;
          add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
          add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Date" always;
          add_header Content-Length 0;
          add_header Content-Type text/plain;
          return 204;
        }
        alias /well-known/server;
      }
      location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        if ($request_method = OPTIONS) {
          add_header Access-Control-Allow-Origin * always;
          add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
          add_header Access-Control-Allow-Headers "X-Requested-With, Content-Type, Authorization, Date" always;
          add_header Content-Length 0;
          add_header Content-Type text/plain;
          return 204;
        }
        alias /well-known/client;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-well-known
  labels:
    app.kubernetes.io/name: matrix-well-known
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-well-known
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-well-known
      annotations:
        # Bump wellKnown.nginxConfigRevision (values.yaml) whenever
        # nginx.conf above changes - confirmed live that hashing only
        # .Values here silently misses template-only edits, since Helm's
        # .Files object can't read files under templates/ to hash them
        # directly. Without this, a changed ConfigMap doesn't roll the
        # pod, and it keeps serving the stale nginx.conf.
        config-hash: {{ dict "wellKnown" .Values.wellKnown "identityServer" .Values.identityServer | toJson | sha256sum }}
    spec:
      containers:
        - name: well-known
          image: "nginx:1.27-alpine"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /well-known/server
              subPath: server
            - name: config
              mountPath: /well-known/client
              subPath: client
          readinessProbe:
            httpGet:
              path: /.well-known/matrix/server
              port: http
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-well-known
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-well-known
  labels:
    app.kubernetes.io/name: matrix-well-known
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: matrix-well-known
---
# Exact-path, high-priority Ingress on the itlusions.com apex (owned by
# the itl-website release) - intercepts ONLY the two .well-known/matrix
# paths, confirmed via the landing-page precedent that Traefik needs the
# explicit router.priority to reliably win an Exact rule over another
# release's catch-all Prefix rule on the same host. Every other path on
# itlusions.com (the actual website) is completely untouched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-well-known
  labels:
    app.kubernetes.io/name: matrix-well-known
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    cert-manager.io/cluster-issuer: "letsencrypt-issuer"
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: {{ .Values.tenant.ingress.className }}
  tls:
    - secretName: {{ .Values.wellKnown.tlsSecretName }}
      hosts:
        - {{ .Values.wellKnown.apexHost }}
  rules:
    - host: {{ .Values.wellKnown.apexHost | quote }}
      http:
        paths:
          - path: /.well-known/matrix/server
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-well-known
                port:
                  number: 80
          - path: /.well-known/matrix/client
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-well-known
                port:
                  number: 80
{{- end }}
