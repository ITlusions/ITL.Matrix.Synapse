{{- if .Values.oidc.enabled }}
{{- $existing := lookup "v1" "Secret" .Values.oidc.keycloakNamespace "matrix-synapse-oidc-secret" }}
{{- $clientSecret := "" }}
{{- if $existing }}
{{- $clientSecret = index $existing.data "client-secret" }}
{{- else }}
{{- $clientSecret = randAlphaNum 32 | b64enc }}
{{- end }}
---
# Read by the Keycloak Operator's KeycloakOIDCClient reconciler
# (keycloakoidcclient.yaml) - the Operator adopts an already-existing
# secretRef as the client's real secret rather than overwriting it, so
# generating this value here (once, then stable via lookup above)
# avoids waiting on the Operator's own async secret creation. Same
# pattern as ITL.Forgejo/ITL.Nextcloud's templates/oidc-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: matrix-synapse-oidc-secret
  namespace: {{ .Values.oidc.keycloakNamespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse
    # Required for the Operator to adopt a pre-existing secret.
    operator.keycloak.org/kind: KeycloakOIDCClient
type: Opaque
data:
  client-secret: {{ $clientSecret }}
---
# Same value, mirrored into this release's own namespace - read by
# templates/_helpers.tpl's itl.matrix.synapse.homeserver define to
# fill oidc_providers[0].client_secret.
apiVersion: v1
kind: Secret
metadata:
  name: matrix-synapse-oidc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrix-synapse
type: Opaque
data:
  client-secret: {{ $clientSecret }}
{{- end }}
