{{- if .Values.identityServer.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-sydent-smtp" .Release.Name) | default (dict "data" (dict)) -}}
{{- $existingHost := index $existing.data "host" | default "" -}}
{{- $existingPort := index $existing.data "port" | default "" -}}
{{- $existingUsername := index $existing.data "username" | default "" -}}
{{- $existingPassword := index $existing.data "password" | default "" -}}
{{- $existingFrom := index $existing.data "from" | default "" -}}
# Single source of truth for Sydent's SMTP credentials - kept as its
# own Secret (not inlined into values.yaml, never committed in
# plaintext) so it survives independently of any one `helm upgrade
# --set` invocation. Update the password (or any other field) going
# forward with:
#   helm upgrade matrix-synapse . -n matrix \
#     --set-string identityServer.smtp.password=<new password>
# A value passed via --set wins; anything left unset falls back to
# whatever is already stored here, so a plain `helm upgrade` without
# re-passing every field never blanks it out - same lookup-preserves
# idiom used for every other generated secret in this chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sydent-smtp
  labels:
    app.kubernetes.io/name: matrix-identity-server
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  host: {{ .Values.identityServer.smtp.host | default ($existingHost | b64dec) | quote }}
  port: {{ .Values.identityServer.smtp.port | toString | default ($existingPort | b64dec) | quote }}
  username: {{ .Values.identityServer.smtp.username | default ($existingUsername | b64dec) | quote }}
  password: {{ .Values.identityServer.smtp.password | default ($existingPassword | b64dec) | quote }}
  from: {{ .Values.identityServer.smtp.from | default ($existingFrom | b64dec) | quote }}
{{- end }}
